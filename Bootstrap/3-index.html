<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bootstrap Exercise</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css"
    integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
  <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"
    integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"
    integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHAEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo"
    crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"
    integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
    crossorigin="anonymous"></script>
</head>

<body>

  <!-- First Div: Container me breakpoint në 992px (container-lg) dhe padding 3rem (p-5) -->
  <div class="container-lg p-5">

    <!-- Card: Row deri në 576px, pastaj Column (flex-column flex-sm-row) dhe mt-4 (1.5rem) -->
    <div class="card flex-column flex-sm-row mt-4">

      <!-- Card Header -->
      <div class="card-header">
        Coding
      </div>

      <!-- Card Body -->
      <div class="card-body">
        <h5 class="card-title">JavaScript</h5>
        <p class="card-text">JavaScript is a programming language that conforms to the ECMAScript specification.</p>
        
        <!-- Button: Danger dhe lidhja me modalin -->
        <button type="button" class="btn btn-danger" data-toggle="modal" data-target="#exampleModal">
          Play with
        </button>
      </div>

      <!-- Card Footer -->
      <div class="card-footer">
        2 hours
      </div>

    </div>

  </div>

  <!-- Second Div: Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-hidden="true">
    <!-- modal-dialog-centered për ta qendruar vertikalisht dhe horizontalisht -->
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Form Title</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <div class="modal-body">
          <!-- Form me border-top dhe pt-3 (1rem padding) -->
          <form class="border-top pt-3">

            <!-- Grupi i formës me label majtas (form-group row) -->
            <div class="form-group row">
              <label for="inputEmail" class="col-sm-3 col-form-label">Email</label>
              <div class="col-sm-9">
                <input type="email" class="form-control" id="inputEmail" placeholder="Enter email">
              </div>
            </div>

            <div class="form-group row">
              <label for="inputPassword" class="col-sm-3 col-form-label">Password</label>
              <div class="col-sm-9">
                <input type="password" class="form-control" id="inputPassword" placeholder="Password">
              </div>
            </div>

          </form>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>

      </div>
